<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InspireMe | Random Quote Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>✦ InspireMe</h1>
            <p class="subtitle">A little inspiration for your day</p>
        </header>

        <main class="quote-card">

            <div class="quote-icon">“</div>

            <p id="quote">
                Your daily inspiration starts here.
            </p>

            <h3 id="author">— InspireMe</h3>

            <div class="buttons">

                <button id="copyBtn" class="copy-btn">
                    Copy Quote
                </button>

                <button id="newQuoteBtn" class="new-btn">
                    ✨ New Quote
                </button>

            </div>

        </main>

        <footer>
            <p>Designed with ♥ to inspire your everyday</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
